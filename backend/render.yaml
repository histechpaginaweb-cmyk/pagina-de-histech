# Blueprint de Render para el backend de HISTECH.
# Si conectas el repo con "Blueprint", Render crea el servicio automáticamente.
# (También puedes crearlo a mano: New → Web Service → root dir "backend".)
services:
  - type: web
    name: histech-backend
    runtime: node
    plan: free
    rootDir: backend
    # `npm install` genera el cliente Prisma (postinstall). `portal:push` sincroniza
    # el esquema del Portal con la BD (Neon) en cada despliegue (aditivo y seguro).
    buildCommand: npm install && npm run portal:push
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false # pon aquí tu dominio de Vercel
      # ── Productos/blog (Cloudflare R2) ──
      - key: R2_ACCOUNT_ID
        sync: false # ID de cuenta de Cloudflare
      - key: R2_ACCESS_KEY_ID
        sync: false # del API Token de R2
      - key: R2_SECRET_ACCESS_KEY
        sync: false # del API Token de R2
      - key: R2_BUCKET
        sync: false # nombre del bucket (ej. histech)
      - key: R2_PUBLIC_URL
        sync: false # URL pública del bucket (r2.dev o dominio propio)
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto aleatorio
      # ── Portal de Soporte Empresarial ──
      - key: PORTAL_DATABASE_URL
        sync: false # cadena de conexión de Neon (Postgres)
      - key: PORTAL_JWT_SECRET
        generateValue: true # secreto de sesión del portal (independiente)
      - key: PORTAL_PUBLIC_URL
        sync: false # dominio del sitio (para los enlaces de los correos)
      # Notificaciones por email (Resend). Sin RESEND_API_KEY no se envían correos.
      - key: RESEND_API_KEY
        sync: false
      - key: PORTAL_MAIL_FROM
        sync: false # ej. "Soporte HISTECH <soporte@histech.com.co>"
      - key: PORTAL_NOTIFY_EMAIL
        sync: false # correo donde HISTECH recibe los avisos de tickets nuevos
      # Solo se usan una vez para `npm run portal:seed` (crear el primer admin):
      - key: PORTAL_ADMIN_EMAIL
        sync: false
      - key: PORTAL_ADMIN_USERNAME
        sync: false
      - key: PORTAL_ADMIN_PASSWORD
        sync: false
      - key: PORTAL_ADMIN_NAME
        sync: false
